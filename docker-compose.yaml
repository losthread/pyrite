services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend/src
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8003}
    ports:
      - "3000:3000"
    depends_on:
      - backend
