<!-- Wazuh Manager – minimal config for VYUH deception log ingestion -->
<ossec_config>

  <!-- ── Global ────────────────────────────────────────────────── -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <logall>yes</logall>
  </global>

  <!-- ── Ruleset ───────────────────────────────────────────────── -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <!-- Custom VYUH rules mounted at /var/ossec/etc/rules/local_rules.xml -->
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- ── VYUH Deception Log ────────────────────────────────────── -->
  <localfile>
    <log_format>json</log_format>
    <!-- shared volume: host ./backend/logs → container /logs -->
    <location>/logs/vyuh_deception.json</location>
  </localfile>

  <!-- ── Remote (agent listener) ───────────────────────────────── -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <!-- ── Logging ───────────────────────────────────────────────── -->
  <logging>
    <log_level>1</log_level>
  </logging>

</ossec_config>
